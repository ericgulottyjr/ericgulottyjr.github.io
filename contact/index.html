<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Eric Gulotty</title>
    <script>
        (function () {
            var stored = localStorage.getItem('theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = (stored === 'light' || stored === 'dark') ? stored : (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);

            function applyTheme(next) {
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                var btn = document.getElementById('theme-toggle');
                if (btn) {
                    btn.classList.toggle('dark-mode', next === 'dark');
                }
            }

            document.addEventListener('DOMContentLoaded', function () {
                var btn = document.getElementById('theme-toggle');
                if (!btn) {
                    return;
                }
                btn.classList.toggle('dark-mode', document.documentElement.getAttribute('data-theme') === 'dark');
                if (btn.dataset.themeInit === 'true') {
                    return;
                }
                btn.dataset.themeInit = 'true';
                btn.addEventListener('click', function () {
                    var current = document.documentElement.getAttribute('data-theme');
                    applyTheme(current === 'dark' ? 'light' : 'dark');
                });
            });
        })();
    </script>
