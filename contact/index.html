<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Eric Gulotty</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        .typewriter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 50px 0;
            min-height: 150px;
        }
        
        .typewriter-text {
            font-size: 2rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
        }
        
        .typewriter-prefix {
            color: var(--primary-color);
            min-width: 10px;
            text-align: right;
        }
        
        .typewriter-static {
            color: var(--text-color);
            margin: 0 4px;
        }
        
        .typewriter-suffix {
            color: var(--primary-color);
            min-width: 10px;
            text-align: left;
        }
        
        .typewriter-text::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to right, var(--card-bg) 0%, transparent 5%, transparent 95%, var(--card-bg) 100%);
            pointer-events: none;
            z-index: 1;
            opacity: 0.4;
        }
        
        .typewriter-prefix::after,
        .typewriter-suffix::after {
            content: "";
            display: none;
        }
        
        .typewriter-prefix.typing::after,
        .typewriter-suffix.typing::after {
            display: none;
        }
        
        .contact-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .contact-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            width: 40px;
            height: 40px;
            background-color: var(--accent-light);
            color: var(--primary-color);
            border-radius: 50%;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .contact-btn:hover {
            background-color: var(--primary-color);
            color: white;
            transform: translateY(-3px);
        }
        
        .contact-btn i {
            margin-right: 0;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-links">
                <li><a href="/">About Me</a></li>
                <li><a href="/work-experience/">Work Experience</a></li>
                <li><a href="/projects/">Projects</a></li>
                <li><a href="/contact/" class="active">Contact</a></li>
            </ul>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                <i class="fas fa-moon"></i>
                <i class="fas fa-sun"></i>
            </button>
        </nav>
    </header>
    <main>
        <section class="work-experience">
            <h1>Let's Connect</h1>
            <p class="section-intro">Feel free to reach out through any of these platforms.</p>
            
            <div class="typewriter-container">
                <div class="typewriter-text">
                    <span class="typewriter-prefix"></span>
                    <span class="typewriter-static">ericgulottyjr</span>
                    <span class="typewriter-suffix"></span>
                </div>
                <div class="contact-buttons">
                    <a href="mailto:ericgulottyjr@gmail.com" class="contact-btn" title="Email" target="_blank">
                        <i class="fas fa-envelope"></i>
                    </a>
                    <a href="https://linkedin.com/in/ericgulottyjr" class="contact-btn" title="LinkedIn" target="_blank">
                        <i class="fab fa-linkedin"></i>
                    </a>
                    <a href="https://github.com/ericgulottyjr" class="contact-btn" title="GitHub" target="_blank">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="https://ericgulottyjr.github.io" class="contact-btn" title="Website" target="_blank">
                        <i class="fas fa-globe"></i>
                    </a>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Eric Gulotty. All rights reserved.</p>
    </footer>
    
    <script src="/scripts.js"></script>
</body>
</html>
